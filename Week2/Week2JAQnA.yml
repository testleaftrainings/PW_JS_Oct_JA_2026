1, Array map, filter and sort methods?

Question: How would you sort an array of objects by a specific property in JavaScript?
Answer:

In JavaScript, I use the sort() method to sort an array of objects based on a specific property. The sort() method accepts a comparator function that determines the order of elements.
- For ascending order, return a.property - b.property for numeric values.
- For descending order, return b.property - a.property.
- For strings, use localeCompare().
1. Example: Sort objects by age
const employees = [
  { name: "Ravi", age: 30 },
  { name: "Arun", age: 25 },
  { name: "Priya", age: 28 }
];

// Sort by age in ascending order
const sortedEmployees = [...employees].sort((a, b) => a.age - b.age);

console.log(sortedEmployees);


Output:
[
  { name: "Arun", age: 25 },
  { name: "Priya", age: 28 },
  { name: "Ravi", age: 30 }
]


Explanation:
- sort() compares two objects, a and b.
- a.age - b.age sorts the employees from youngest to oldest.
- [...employees] creates a shallow copy so that the original array is not modified.
2. Sort in descending order
const sortedEmployees = [...employees].sort((a, b) => b.age - a.age);

console.log(sortedEmployees);


Output: Ravi (30), Priya (28), Arun (25).
3. Sort objects by a string property
const employees = [
  { name: "Ravi", role: "SDET" },
  { name: "Arun", role: "Developer" },
  { name: "Priya", role: "Tester" }
];

const sortedEmployees = [...employees].sort((a, b) =>
  a.role.localeCompare(b.role)
);

console.log(sortedEmployees);


This sorts employees alphabetically by their role property.
