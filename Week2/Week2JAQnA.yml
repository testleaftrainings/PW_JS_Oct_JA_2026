1. map() — Get a specific value from every employee
Question: How do you get only the employee names?
const employees = [
  { name: "Ravi", age: 30 },
  { name: "Arun", age: 25 },
  { name: "Priya", age: 28 }
];

const names = employees.map(emp => emp.name);

console.log(names);


Output:
["Ravi", "Arun", "Priya"]


How it works:
- map() visits every employee.
- emp.name extracts the name from each object.
- It returns a new array containing the names.
Think of it as: One input element → One output element.
2. filter() — Get employees older than 27
Question: How do you find employees whose age is greater than 27?
const olderEmployees = employees.filter(emp => emp.age > 27);

console.log(olderEmployees);


Output:
[
  { name: "Ravi", age: 30 },
  { name: "Priya", age: 28 }
]


How it works:
- filter() checks every employee.
- If emp.age > 27 is true, the employee is included.
- If false, the employee is excluded.
Think of it as: Keep the elements that satisfy a condition.
3. reduce() — Calculate the total age
Question: How do you calculate the total age of all employees?
const totalAge = employees.reduce((total, emp) => {
  return total + emp.age;
}, 0);

console.log(totalAge);


Output:
83


How it works:

The 0 is the initial value of total.
Employee	Calculation	Total
Ravi	0 + 30	30
Arun	30 + 25	55
Priya	55 + 28	83
